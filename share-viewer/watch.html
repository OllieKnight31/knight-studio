<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Video</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="wrap" id="app"><div class="state"><div class="spinner"></div></div></div>
<script src="config.js"></script>
<script src="player.js"></script>
<script src="cloud.js"></script>
<script>
// A video shared through the sharing service: invited people sign in to watch, and what
// they watch is recorded against their name.
(() => {
  const app = document.getElementById('app')
  const { render, fail, esc, LOGO } = window.KSPlayer
  const cloud = window.KSCloud
  const q = new URLSearchParams(location.search)
  const id = q.get('v')
  const embed = q.get('embed') === '1'
  if (embed) document.body.classList.add('embed')
  if (!cloud.ready) return fail(app, 'Sharing is not available yet', 'This page has not been connected to the sharing service.')
  if (!id || !/^[\w-]{4,40}$/.test(id)) return fail(app, 'This link is incomplete', 'Ask whoever sent it to copy the link again.')
  cloud.adoptLink()

  const badge = (required, percent, completed) => !cloud.signedIn() ? ''
    : completed ? `<div class="status"><span class="pill done">✓ Completed</span>${required ? '<span>Required viewing — done.</span>' : ''}</div>`
      : required ? `<div class="status"><span class="pill">Required viewing</span><span>${percent ? `${percent}% watched so far` : 'Watch it through to mark it complete'}</span></div>`
        : percent ? `<div class="status"><span>${percent}% watched</span></div>` : ''

  async function open () {
    app.innerHTML = '<div class="state"><div class="spinner"></div></div>'
    let w
    try { w = await cloud.rpc('ks_watch', { p_video: id }) } catch { return fail(app, 'The video could not be loaded', 'Check your internet connection and try again.') }

    if (w.need === 'gone') return fail(app, 'This video is no longer shared', 'The person who shared it has taken it down, or the link is wrong.')
    if (w.need === 'signin') {
      return cloud.gate(app, { title: 'Sign in to watch', text: 'This video was shared with specific people. Sign in with the email address it was shared with.', onDone: open })
    }
    if (w.need === 'access') {
      app.innerHTML = `<div class="gate"><h1>You do not have access</h1><p>This video has not been shared with <b>${esc(w.email || cloud.email())}</b>. Ask the person who sent the link to add this address, or sign in with a different one.</p><button class="go" id="other">Use a different email</button></div>`
      app.querySelector('#other').onclick = () => { cloud.signOut(); open() }
      return
    }

    const meta = w.meta || {}
    const name = w.workspace || ''
    const session = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g, '').slice(0, 32)
    let state = { percent: w.percent || 0, completed: !!w.completed }
    const top = `<div class="bar"><div class="grow">${LOGO}${name ? `<span>${esc(name)}</span>` : ''}</div>${cloud.signedIn() ? `<span class="who">${esc(cloud.email())}</span><a href="shared">Shared with me</a><button id="out">Sign out</button>` : ''}</div>`
    const page = render(app, {
      title: w.title, video: cloud.fileUrl(w.file), poster: cloud.fileUrl(w.poster), duration: w.duration, publishedAt: w.publishedAt,
      summary: meta.summary, chapters: meta.chapters, steps: meta.steps, cues: meta.cues
    }, {
      embed, top, startAt: Number(q.get('t')) || 0,
      status: badge(w.required, state.percent, state.completed),
      record: ({ seconds, duration, bits }) => cloud.beacon('ks_view', { p_video: id, p_session: session, p_seconds: seconds, p_duration: duration, p_bits: bits })
    })
    // The service answers with the running total across every visit; show it as it grows.
    cloud.beacon.onAnswer = j => {
      if (!j || j.percent === undefined) return
      state = { percent: j.percent, completed: state.completed || !!j.completed }
      page.setStatus(badge(w.required, state.percent, state.completed))
    }
    const out = app.querySelector('#out')
    if (out) out.onclick = () => { cloud.signOut(); open() }
  }
  open()
})()
</script>
</body>
</html>
