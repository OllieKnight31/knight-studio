<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Video</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="wrap" id="app"><div class="state"><div class="spinner"></div></div></div>
<script src="player.js"></script>
<script>
// A share page whose video lives in the sharer's Google Drive. The page — title, brand,
// summary, chapters, steps, transcript — is ours; the video is shown by Google Drive's
// own player inside it, because Google does not allow Drive videos to be played by
// anyone else's player.
(() => {
  const app = document.getElementById('app')
  const { render, fail, esc, LOGO } = window.KSPlayer
  const q = new URLSearchParams(location.search)
  const embed = q.get('embed') === '1'
  if (embed) document.body.classList.add('embed')
  const ok = id => typeof id === 'string' && /^[\w-]{10,80}$/.test(id)
  const image = id => ok(id) ? `api/drive?img=${id}` : null
  const metaId = q.get('m')
  if (!ok(metaId)) return fail(app, 'This link is incomplete', 'Ask whoever sent it to copy the share link again.')

  fetch(`api/drive?m=${metaId}`, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(String(r.status)); return r.json() })
    .then(m => {
      const start = Math.floor(Number(q.get('t')) || 0)
      render(app, m, {
        embed,
        frame: `https://drive.google.com/file/d/${m.video}/preview${start > 0 ? `?t=${start}` : ''}`,
        top: `<header class="top">${LOGO}</header>`
      })
    })
    .catch(e => /^(400|404|413)$/.test(e.message)
      ? fail(app, 'This video is no longer shared', 'The person who shared it has taken it down, or the link is wrong.')
      : fail(app, 'The video could not be loaded', 'Check your internet connection and try again.'))
})()
</script>
</body>
</html>
